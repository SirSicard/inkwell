name: Windows release

# Releases the Windows app (docs/RELEASING.md), unsigned for now: no code signing yet, and the
# homepage tells people how to get past SmartScreen and check the download. On a v1.X.Y tag: for x64
# and for ARM64, each on its own machine, build the core with that architecture's engines and the
# app (NativeAOT), check that neither needs anything a PC may lack (a Visual C++ runtime, the Vulkan
# driver, Windows' own older ONNX Runtime), pack the installer and the update feed with Velopack,
# each architecture on its own update channel, and write their SHA-256s
# (win-release-build.yml); then draft the GitHub release holding both architectures' files (or add
# them to the draft the Mac's workflow made for the same tag). A person publishes the draft; nothing
# here does.
#
# A manual run is the dry run: the same builds, checks and packs, the release's files kept as run
# artifacts, and nothing published. (Pull requests build and pack ARM64 the same way, keeping
# nothing: win-arm64.yml.)
#
# How an unsigned build is still checked, end to end: every input is pinned (win-release-build.yml
# lists them); the release's files carry their SHA-256s in the release and in its notes; the app
# reads its update feed over HTTPS from this repository's releases, and Velopack refuses a package
# whose size or SHA-256 differs from the feed's.
#
# Secrets and privileges, by job:
# - build-x64, build-arm64: no secret; read access to the repository only.
# - publish (tag only): write access, in the `release` environment, whose deployment rule admits
#   v1.* tags alone. It holds no secret for Windows (the Sparkle key there is the Mac's).
# Neither trigger can come from a pull request, so no fork's code runs next to write access; there
# is no pull_request_target. Actions are pinned by commit, and no step restores a cache: what
# ships is built from the checkout alone.
on:
  push:
    tags: ['v1.*']
  workflow_dispatch:
    inputs:
      version:
        description: The version to build the dry run as (X.Y.Z). Nothing is published.
        required: true
        default: '1.0.0'

permissions: {}

concurrency:
  group: win-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-x64:
    name: x64
    uses: ./.github/workflows/win-release-build.yml
    permissions:
      contents: read
    with:
      arch: x64
      kind: ${{ github.event_name == 'push' && 'tag' || 'dry-run' }}
      version: ${{ inputs.version || '1.0.0' }}

  build-arm64:
    name: ARM64
    uses: ./.github/workflows/win-release-build.yml
    permissions:
      contents: read
    with:
      arch: arm64
      kind: ${{ github.event_name == 'push' && 'tag' || 'dry-run' }}
      version: ${{ inputs.version || '1.0.0' }}

  # A tag's release: both architectures' files added to the draft release for the tag (the Mac's
  # workflow drafts it too; whichever comes first creates it), with a Windows section in its notes.
  # Publishing the draft is a person's step (docs/RELEASING.md): until then no installed app sees
  # it, since the app's updater reads published releases only.
  publish:
    name: add to the draft release
    needs: [build-x64, build-arm64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inkwell-windows-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inkwell-windows-arm64
          path: release

      # The files the release carries, checked against their SHA-256s once more after the trip
      # through the artifact store; the two builds are of one version.
      - name: Check the files
        working-directory: release
        env:
          VERSION_X64: ${{ needs.build-x64.outputs.version }}
          VERSION_ARM64: ${{ needs.build-arm64.outputs.version }}
          FILES: >-
            ${{ needs.build-x64.outputs.setup }} ${{ needs.build-x64.outputs.package }}
            ${{ needs.build-x64.outputs.feed }} ${{ needs.build-x64.outputs.sums }}
            ${{ needs.build-arm64.outputs.setup }} ${{ needs.build-arm64.outputs.package }}
            ${{ needs.build-arm64.outputs.feed }} ${{ needs.build-arm64.outputs.sums }}
          SUMS_X64: ${{ needs.build-x64.outputs.sums }}
          SUMS_ARM64: ${{ needs.build-arm64.outputs.sums }}
        run: |
          if [ -z "$VERSION_X64" ] || [ "$VERSION_X64" != "$VERSION_ARM64" ]; then
            echo "::error::the x64 build is version '$VERSION_X64' and the ARM64 build '$VERSION_ARM64'"
            exit 1
          fi
          read -r -a files <<<"$FILES"
          [ "${#files[@]}" -eq 8 ] || { echo "::error::expected 8 files, the builds named ${#files[@]}"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          sha256sum -c "$SUMS_X64" "$SUMS_ARM64"

      # A draft: invisible to installed apps and to the Download button until a person publishes
      # it. A re-run replaces a draft's Windows files and never touches a published release.
      - name: Draft the release, or add to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-x64.outputs.version }}
          FILES: >-
            ${{ needs.build-x64.outputs.setup }} ${{ needs.build-x64.outputs.package }}
            ${{ needs.build-x64.outputs.feed }} ${{ needs.build-x64.outputs.sums }}
            ${{ needs.build-arm64.outputs.setup }} ${{ needs.build-arm64.outputs.package }}
            ${{ needs.build-arm64.outputs.feed }} ${{ needs.build-arm64.outputs.sums }}
          SETUP_X64: ${{ needs.build-x64.outputs.setup }}
          FEED_X64: ${{ needs.build-x64.outputs.feed }}
          SUMS_X64: ${{ needs.build-x64.outputs.sums }}
          SETUP_ARM64: ${{ needs.build-arm64.outputs.setup }}
          FEED_ARM64: ${{ needs.build-arm64.outputs.feed }}
          SUMS_ARM64: ${{ needs.build-arm64.outputs.sums }}
        run: |
          cd release
          read -r -a files <<<"$FILES"
          sum_x64="$(sha256sum "$SETUP_X64" | cut -d' ' -f1)"
          sum_arm64="$(sha256sum "$SETUP_ARM64" | cut -d' ' -f1)"
          marker='<!-- inkwell-windows -->'
          cat >"$RUNNER_TEMP/windows.md" <<EOF
          $marker
          **Windows: download \`$SETUP_X64\`** for a PC with an Intel or AMD processor, or \`$SETUP_ARM64\` for one with an ARM processor (Settings > System > About says "ARM-based processor"): Inkwell for Windows 11 (24H2 or later), installed for your user alone, no administrator needed. The ARM64 build does not yet tell apart the speakers at the far end of a meeting. Neither is code-signed yet, so SmartScreen warns before it runs: choose **More info**, then **Run anyway**. Check the download first: the SHA-256 of \`$SETUP_X64\` is \`$sum_x64\`, and of \`$SETUP_ARM64\` \`$sum_arm64\` (also in \`$SUMS_X64\` and \`$SUMS_ARM64\`). The \`.nupkg\` files, \`$FEED_X64\` and \`$FEED_ARM64\` are what the app's updater reads; there is no need to download them.

          Inkwell includes the runtime of Microsoft's Windows App SDK and the Windows SDK's .NET projection, which Microsoft licenses separately under the Microsoft Software License Terms (shown in full in Inkwell's Settings > About). By installing or using Inkwell on Windows, you agree to those terms for those components.
          EOF
          attach() {
            local draft
            draft="$(gh release view "$GITHUB_REF_NAME" --repo "$REPO" --json isDraft --jq .isDraft)"
            if [ "$draft" != true ]; then
              echo "::error title=Already published::$GITHUB_REF_NAME is a published release; it is never replaced"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$REPO"
            body="$(gh release view "$GITHUB_REF_NAME" --repo "$REPO" --json body --jq .body)"
            if ! grep -qF -- "$marker" <<<"$body"; then
              printf '%s\n\n%s' "$body" "$(cat "$RUNNER_TEMP/windows.md")" >"$RUNNER_TEMP/notes.md"
              gh release edit "$GITHUB_REF_NAME" --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md"
            fi
            echo "draft $GITHUB_REF_NAME: Windows files added"
          }
          if gh release view "$GITHUB_REF_NAME" --repo "$REPO" --json isDraft >/dev/null 2>&1; then
            attach
          else
            {
              cat "$RUNNER_TEMP/windows.md"
              printf '\nSee the [changelog](https://github.com/%s/blob/main/CHANGELOG.md) for what changed.\n' "$REPO"
            } >"$RUNNER_TEMP/notes.md"
            if gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$REPO" \
              --draft --verify-tag --title "Inkwell $VERSION" --notes-file "$RUNNER_TEMP/notes.md"; then
              echo "drafted $GITHUB_REF_NAME"
            else
              # The Mac's workflow may have drafted it meanwhile: add to that one.
              attach
            fi
          fi
