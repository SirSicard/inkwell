name: Windows

# The Windows shell (windows/): the generated C# is current, every NuGet package's licence is on
# the allowlist, and the solution builds and passes its tests against the core's DLL (the cdylib
# of core/crates/ink-ffi, engine features off). The core's own tests run in core.yml.
on:
  push:
    branches: [main]
    paths: ['windows/**', 'core/**', 'schema/**', '.github/workflows/win.yml']
  pull_request:
    paths: ['windows/**', 'core/**', 'schema/**', '.github/workflows/win.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  shell:
    name: licences, build and tests (windows-2025)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the channel and components pinned in core/rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: core
      # Pinned to the commit tag v2.9.1 points at, read from GitHub (never typed from memory).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: core
      # The C# event types (ink-schema) and P/Invoke declarations (csbindgen) match the schema and
      # the core's C ABI.
      - name: Generated C# is current
        working-directory: core
        run: |
          cargo run --locked -p ink-ffi --bin ink-schema -- --check
          cargo test --locked -p ink-ffi --test csharp_binding --test schema
      # The DLL the shell loads, as the shell links it: engine features off.
      - name: Build the core's DLL
        working-directory: core
        run: cargo build --locked -p ink-ffi --lib
      # The SDK windows/global.json pins, read from there. Pinned to the commit tag v6.0.0 points
      # at, read from GitHub (never typed from memory).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Restore (locked)
        run: dotnet restore windows/Inkwell.slnx --locked-mode
      # Every package restore pulled, direct and transitive, before anything is built from it.
      - name: NuGet licence check
        shell: pwsh
        run: windows/scripts/nuget-licences.ps1
      - name: Build
        run: dotnet build windows/Inkwell.slnx --no-restore
      - name: Tests
        run: dotnet test windows/Inkwell.slnx --no-build
