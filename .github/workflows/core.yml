name: Core

# The Rust core (core/). The legacy Tauri app keeps its own workflow, build.yml.
on:
  push:
    branches: [main]
    paths: ['core/**', '.github/workflows/core.yml']
  pull_request:
    paths: ['core/**', '.github/workflows/core.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: core

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned: the shells target macOS 26 and Windows 11 24H2.
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the channel and components pinned in core/rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The engine adapters sit behind features the workspace build leaves off.
      # Silero VAD: the model its tests run on, from the commit tag v6.2.3 points at, checked
      # against the hash the registry row pins. A mismatch fails the job.
      - name: Fetch the Silero VAD model
        shell: bash
        env:
          SILERO_URL: https://raw.githubusercontent.com/snakers4/silero-vad/5cd7945676eb32225748052e2e6a0580e4686a08/src/silero_vad/data/silero_vad_16k_op15.onnx
          SILERO_SHA256: 7ed98ddbad84ccac4cd0aeb3099049280713df825c610a8ed34543318f1b2c49
        run: |
          model="$RUNNER_TEMP/silero_vad_16k_op15.onnx"
          curl -fsSL --retry 3 -o "$model" "$SILERO_URL"
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum <"$model" | cut -d' ' -f1)
          else
            sum=$(shasum -a 256 <"$model" | cut -d' ' -f1)
          fi
          if [ "$sum" != "$SILERO_SHA256" ]; then
            echo "::error::Silero VAD model sha256 is $sum, expected $SILERO_SHA256"
            exit 1
          fi
          echo "INK_SILERO_MODEL=$model" >>"$GITHUB_ENV"
      - run: cargo clippy -p ink-engines --all-targets --locked --features engine-silero -- -D warnings
      - run: cargo test -p ink-engines --locked --features engine-silero
      # NeMo-Speech.cpp is a native library CI does not build: the adapter is compiled and linted
      # without linking it.
      - run: cargo clippy -p ink-engines --all-targets --locked --features engine-nemo -- -D warnings
        env:
          INK_NEMO_CHECK_ONLY: "1"

  deny:
    name: licences, advisories, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check
