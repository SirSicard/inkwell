<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      /* The window is sized by overlay.rs, which is the only thing that knows
         whether live partials are on. Filling it here means the two cannot
         disagree about the width. */
      width: 100%;
      height: 97px;
      margin: 0;
      padding: 0;
    }
    #row { display: flex; align-items: center; height: 97px; }
    canvas {
      width: 97px;
      height: 97px;
      display: block;
      flex: 0 0 97px;
    }
    /* Collapsed until there are words, so a dictation with nothing said yet
       shows the same bare blob it always did. */
    #partial {
      flex: 1 1 auto;
      min-width: 0;
      margin-left: 2px;
      padding: 9px 14px;
      border-radius: 13px;
      background: rgba(12, 11, 10, 0.92);
      border: 1px solid rgba(240, 239, 232, 0.14);
      color: rgba(240, 239, 232, 0.88);
      font: 14px/1.35 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.005em;
      /* Two lines, and no more: 2 x 1.35em of text plus the padding and
         border, which box-sizing folds into the height. -webkit-line-clamp was
         the obvious way to write this and does nothing here, because a flex
         item's display computes to flow-root and the clamp needs -webkit-box.
         A measured max-height needs no such cooperation. The Rust side already
         caps the string at 96 characters, so this is the second line of
         defence rather than the first. */
      max-height: calc(2.7em + 20px);
      overflow: hidden;
      opacity: 0;
      transition: opacity 120ms ease-out;
    }
    #partial.on { opacity: 1; }
    /* With live preview off the window is 97px wide and there is only ever the
       blob. Relying on overflow:hidden to clip an empty 0-opacity panel works,
       but it leaves a flex item competing for width in the one layout that has
       none to give. Taking it out of flow entirely means the collapsed overlay
       is the same box it was before this feature existed. */
    #partial:empty { display: none; }
  </style>
</head>
<body>
  <div id="row">
    <canvas id="c" width="194" height="194"></canvas>
    <div id="partial"></div>
  </div>
  <script>
    // ── Live partial text ────────────────────────────────────────────────
    // Feedback only. These words are never what gets pasted: the offline model
    // produces that a moment later, with the casing and punctuation a streaming
    // decoder cannot give you. They are lowercase for exactly that reason, so
    // the switch to the real text reads as the app settling on an answer
    // rather than correcting a mistake. See src-tauri/src/streaming.rs.
    const partialEl = document.getElementById('partial');

    function setPartial(text) {
      partialEl.textContent = text || '';
      partialEl.classList.toggle('on', !!text);
    }

    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen("partial-text", (e) => {
        setPartial(typeof e.payload === "string" ? e.payload : "");
      }).catch(() => {});

      // The overlay window is hidden between dictations rather than destroyed,
      // so without this the last thing said would flash back on screen for a
      // frame at the start of the next one.
      window.__TAURI__.event.listen("recording-state", (e) => {
        if (e.payload === true) setPartial("");
      }).catch(() => {});
    }

    const canvas = document.getElementById('c');
    canvas.width = 194; canvas.height = 194;

    // ── Real microphone level ────────────────────────────────────────────
    // These bars used to be a sine of elapsed time: they danced identically
    // whether the mic was picking up a voice or nothing at all. That made the
    // one surface a user sees on every dictation the one surface that could not
    // tell them anything, and it is part of why a 35 dB capture problem went
    // unnoticed for so long. They now follow the same audio-amplitude events the
    // main window uses.
    const BAR_COUNT_MAX = 16;
    const levels = new Array(BAR_COUNT_MAX).fill(0);
    let lastLevelAt = 0;

    // Adaptive gain, because a fixed multiplier cannot serve both machines.
    // The MacBook mic array is read through the raw HAL with no AGC, so speech
    // arrives around 0.0005 RMS; the previous fixed "rms * 12" mapped that to
    // 0.6% of the bar range, which is why the meter technically moved and
    // visibly did not. Normalising against a decaying running peak instead
    // means the loudest thing you have said recently is full height, whatever
    // your microphone's absolute level happens to be.
    const NOISE_FLOOR = 0.0004;   // below this it is a quiet room, not speech
    const MIN_PEAK = 0.0015;      // stops silence being amplified into noise
    let peak = MIN_PEAK;

    function pushLevel(rms) {
      // Rise to a new peak at once; decay slowly so one loud syllable does not
      // permanently flatten everything after it.
      peak = rms > peak ? rms : Math.max(peak * 0.985, MIN_PEAK);

      const norm = rms <= NOISE_FLOOR ? 0 : Math.min(1, rms / peak);
      // Perceptual curve. Loudness is not linear, and speech spends most of its
      // time in the bottom third of its own range, so a straight ratio leaves
      // normal talking looking almost flat.
      const v = Math.pow(norm, 0.55);

      levels.shift();
      levels.push(v);
      lastLevelAt = performance.now();
    }

    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen("audio-amplitude", (e) => {
        if (typeof e.payload === "number") pushLevel(e.payload);
      }).catch(() => {});
    }

    // If events stop arriving (recording ended, or the bridge is unavailable),
    // decay to flat instead of freezing mid-waveform.
    function decayIfStale() {
      if (performance.now() - lastLevelAt < 200) return;
      for (let i = 0; i < levels.length; i++) levels[i] *= 0.88;
    }
    const ctx = canvas.getContext('2d');
    const W = 194, H = 194, CX = W/2, CY = H/2;

    function noise(x, y) {
      const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      return (s - Math.floor(s)) * 2 - 1;
    }

    function smoothNoise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const n00 = noise(ix, iy), n10 = noise(ix+1, iy);
      const n01 = noise(ix, iy+1), n11 = noise(ix+1, iy+1);
      return n00*(1-sx)*(1-sy) + n10*sx*(1-sy) + n01*(1-sx)*sy + n11*sx*sy;
    }

    function fbm(x, y) {
      return smoothNoise(x, y) * 0.6 + smoothNoise(x*2, y*2) * 0.3 + smoothNoise(x*4, y*4) * 0.1;
    }

    const barCount = 5;
    let barHeights = new Array(barCount).fill(0);

    function render() {
      const t = Date.now() * 0.001;
      ctx.clearRect(0, 0, W, H);

      // Dark ink blob, irregular organic shape
      const baseRadius = 72;
      const segments = 80;

      ctx.beginPath();
      for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        const nx = Math.cos(angle), ny = Math.sin(angle);

        // Multiple noise layers at different scales for irregular shape
        const n1 = fbm(nx * 0.8 + t * 0.3, ny * 0.8 - t * 0.2);       // large slow bulges
        const n2 = fbm(nx * 1.8 + t * 0.5 + 7, ny * 1.8 - t * 0.4 + 7); // medium warps
        const n3 = fbm(nx * 3.5 + t * 0.7 + 15, ny * 3.5 - t * 0.6 + 15); // small detail
        const n4 = smoothNoise(angle * 2.5 + t * 0.6, t * 0.15);         // angular asymmetry
        const deform = n1 * 12 + n2 * 6 + n3 * 3 + n4 * 5;

        const r = baseRadius + deform;
        const x = CX + nx * r;
        const y = CY + ny * r;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      // Base dark ink fill
      const baseGrad = ctx.createRadialGradient(CX, CY + 8, 4, CX, CY, baseRadius + 6);
      baseGrad.addColorStop(0, '#141312');
      baseGrad.addColorStop(0.7, '#0c0b0a');
      baseGrad.addColorStop(1, '#060505');
      ctx.fillStyle = baseGrad;
      ctx.fill();

      // Top-left specular highlight (light catching the ink surface)
      ctx.save();
      ctx.clip(); // clip to blob shape
      const specGrad = ctx.createRadialGradient(CX - 14, CY - 16, 2, CX - 10, CY - 10, baseRadius * 0.6);
      specGrad.addColorStop(0, 'rgba(240, 239, 232, 0.12)');
      specGrad.addColorStop(0.3, 'rgba(240, 239, 232, 0.04)');
      specGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = specGrad;
      ctx.fill();

      // Bottom shadow (depth, gravity pulling the ink down)
      const shadowGrad = ctx.createRadialGradient(CX + 4, CY + 18, 2, CX, CY + 10, baseRadius * 0.8);
      shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.3)');
      shadowGrad.addColorStop(0.5, 'rgba(0, 0, 0, 0.1)');
      shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = shadowGrad;
      ctx.fill();

      // Secondary subtle highlight on the right edge
      const edgeGrad = ctx.createRadialGradient(CX + 20, CY - 8, 1, CX + 16, CY - 4, baseRadius * 0.4);
      edgeGrad.addColorStop(0, 'rgba(240, 239, 232, 0.05)');
      edgeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = edgeGrad;
      ctx.fill();
      ctx.restore();

      // Cream outline
      ctx.strokeStyle = 'rgba(240, 239, 232, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Soundwave bars: a real rolling level meter, not decoration.
      const barW = 3.5;
      const barGap = 5;
      const totalW = barCount * barW + (barCount - 1) * barGap;
      const startX = CX - totalW / 2;

      for (let i = 0; i < barCount; i++) {
        // Take the newest barCount samples, oldest-left, so the bars read like
        // a waveform scrolling past. Indexed from the end so the buffer length
        // and the bar count can differ without silently rendering stale audio.
        const target = 2 + levels[levels.length - barCount + i] * 30;
        // Asymmetric again, for the same reason as the Rust side: a voice
        // starts abruptly and trails off, so the bars snap up and ease down.
        const k = target > barHeights[i] ? 0.6 : 0.2;
        barHeights[i] += (target - barHeights[i]) * k;
      }

      for (let i = 0; i < barCount; i++) {
        const x = startX + i * (barW + barGap);
        const h = barHeights[i];
        const y = CY - h / 2;

        ctx.beginPath();
        ctx.roundRect(x, y, barW, h, 2);
        const opacity = i === Math.floor(barCount/2) ? 0.5 : 0.3;
        ctx.fillStyle = `rgba(240, 239, 232, ${opacity})`;
        ctx.fill();
      }

      decayIfStale();

      // Film grain
      for (let i = 0; i < 40; i++) {
        const gx = Math.random() * W;
        const gy = Math.random() * H;
        const dx = gx - CX, dy = gy - CY;
        if (dx*dx + dy*dy < (baseRadius+5)*(baseRadius+5)) {
          ctx.fillStyle = `rgba(240, 239, 232, ${Math.random() * 0.025})`;
          ctx.fillRect(gx, gy, 1, 1);
        }
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
