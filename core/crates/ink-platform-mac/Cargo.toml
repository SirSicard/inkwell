[package]
name = "ink-platform-mac"
description = "objc2 implementations of the platform traits on macOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ink-core.workspace = true

# macOS only. On every other OS the crate builds empty, so none of these reach the Windows build.
# Default features are off throughout: the framework crates otherwise pull in every header.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSObject",
    "NSString",
    "NSURL",
    "NSUUID",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFDate",
    "CFDictionary",
    "CFMachPort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }
# Capture (S2.1a): the HAL, process taps (`CATapDescription`, macOS 14.2+) and aggregate devices.
objc2-core-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "AudioHardware",
    "objc2",
    "objc2-core-audio-types",
    "objc2-foundation",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
# The completion handler of the microphone prompt (`requestAccessForMediaType:completionHandler:`).
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
# The realtime guard seam (I4) and, in the probe, the capture ring the IOProcs push into.
ink-audio = { path = "../ink-audio" }

# The input checklist binary checks that the main run loop is serving (the pasteboard promise is
# answered there) by dispatching to it.
[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
# I4: the IOProcs are proven allocation-free, in the unit tests (synthetic buffer lists) and in
# the capture checklist binary (real devices). BSD-1-Clause, test-only (deny.toml has the
# crate-scoped exception). Warn mode in both profiles, as in ink-audio: a test counts violations.
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
