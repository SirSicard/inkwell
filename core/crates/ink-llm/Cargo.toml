[package]
name = "ink-llm"
description = "BYOK client, local-only guard, keyring, local summaries and commitments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ink-core.workspace = true
# API keys live in the OS keychain (keyring 4.x split into a core crate and per-OS stores).
keyring-core = "1.0.0"
# The one HTTP stack of the core: blocking, so no async runtime, and the OS TLS stack (native-tls)
# rather than rustls, so no webpki-roots. native-tls is reached through ureq's re-export.
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
# URL parsing for the local-only guard. Not `url`: its idna dependency brings the ICU crates.
http = "1"
# Request bodies and answers are built and read as `serde_json::Value`, with no derive macros.
serde_json = "1"
# Only for `log_record_allowed`, the filter every logger in the app applies: ureq's debug log
# writes request headers. This crate itself logs nothing.
log = "0.4"
# API keys are wiped from memory when dropped.
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# The login keychain, where Inkwell 0.2 kept its keys (re-linked by reference in S2.9a). The
# data-protection keychain ("protected") needs a signed app with a keychain entitlement (S2.3).
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
ink-core = { workspace = true, features = ["mock"] }
