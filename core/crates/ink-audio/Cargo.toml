[package]
name = "ink-audio"
description = "Ring, chunk store, replay, resampler, downmix, gain stage, VAD and bands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ink-core.workspace = true
# The capture ring: a wait-free SPSC ring, safe on the realtime producer side.
rtrb = "0.3.5"
# WAV fixtures for FileReplaySource. Apache-2.0, no dependencies.
hound = "3.5.1"

[dev-dependencies]
ink-core = { workspace = true, features = ["mock"] }
# I4: tests prove the realtime path never allocates. BSD-1-Clause, test-only (allowed for this crate in deny.toml).
# Warn mode in both profiles, not the default abort-in-debug/no-op-in-release: a test can then count
# violations and fail with a message, the control test can prove the guard fires, and
# `cargo test --release` still checks instead of passing vacuously.
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
