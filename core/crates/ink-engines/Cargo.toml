[package]
name = "ink-engines"
description = "Engine registry, downloader, router, residency, and adapters behind cargo features."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The NeMo-Speech.cpp library build.rs links (engine-nemo). Declaring it passes the library's
# directory to dependents' build scripts (DEP_NEMO_SPEECH_ASR_C_LIB_DIR), so their test binaries
# can find it too (ink-pipeline's build.rs).
links = "nemo_speech_asr_c"

[features]
default = ["http"]
# The real HTTP transport for the downloader. Off, the crate still builds and every test runs:
# tests use an in-memory fetcher.
http = ["dep:ureq"]
# llama.cpp: Qwen3-ASR (the dictation and meeting finals, through mtmd) and local GGUF chat models.
# Off by default: it compiles llama.cpp and its ggml with cmake, and CI has no models. llama.cpp is
# linked statically, so its ggml stays inside the core (docs/ARCHITECTURE.md, "ggml").
engine-llama = ["dep:llama-cpp-2", "dep:tracing"]
# llama.cpp's Vulkan backend, for Windows: the engine runs on a Vulkan GPU where the machine has
# one and on the CPU where it has none (src/compute.rs). Building it needs the Vulkan SDK
# (VULKAN_SDK), libclang for llama-cpp-sys-2's bindings (LIBCLANG_PATH) and the Ninja generator
# (CMAKE_GENERATOR=Ninja): with Visual Studio's generator, MSBuild runs the shader generator's
# install step before its configure step. The binary then loads vulkan-1.dll, which GPU drivers
# install. Never on the Mac, which runs on Metal.
engine-llama-vulkan = ["engine-llama", "llama-cpp-2/vulkan"]
# Silero VAD on tract, a pure-Rust ONNX runtime: ink-audio's speech probability, no native code and
# no build-time download.
engine-silero = ["dep:tract-onnx"]
# Nemotron-3-Diarization through NeMo-Speech.cpp's C API. Links a library built outside cargo:
# set NEMO_SPEECH_DIR to its install prefix (native/build-nemo-speech.sh; checked in build.rs).
engine-nemo = []

[dependencies]
ink-core.workspace = true
# Model files are checked against the registry's sha256 before they are moved into place.
sha2 = "0.10.9"
# One HTTP stack for the whole core: ureq 2 with the OS's TLS (native-tls), no rustls, so no
# webpki-roots.
ureq = { version = "2.12.1", default-features = false, features = ["native-tls"], optional = true }
# Pinned exactly: each release vendors a different llama.cpp and ggml, and the ggml link test and
# the Qwen3-ASR WER check hold for this one. No default features: no OpenMP, no `common` (its
# JSON-schema and Jinja helpers are not needed). `metal` is what the Mac runs on; it is a no-op
# elsewhere.
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = ["metal", "mtmd"], optional = true }
# llama.cpp's logs arrive as `tracing` events (through llama-cpp-2); `llama::log_allowed` reads
# their metadata. Already in llama-cpp-2's tree.
tracing = { version = "0.1.44", optional = true }
# The speech-probability trait the VAD adapter implements, named in every build by `load_vad`
# (a workspace crate every core build already links).
ink-audio = { path = "../ink-audio" }
# engine-silero: ONNX inference in pure Rust (MIT OR Apache-2.0). Exact pin: the model graph is
# checked against this version's optimiser. Default features off: they add tract-transformers,
# which the VAD does not need.
tract-onnx = { version = "=0.23.8", default-features = false, optional = true }

# The machine's physical core count, the thread count for CPU inference (src/compute.rs). MIT OR
# Apache-2.0; uses libc, already in the tree, on Unix and a Win32 call on Windows.
num_cpus = "1.17.0"

[build-dependencies]
# build.rs checks the NeMo-Speech.cpp headers it links against by SHA-256 (already a dependency).
sha2 = "0.10.9"

[dev-dependencies]
ink-core = { workspace = true, features = ["mock"] }
# Checks that the local model's JSON answers parse (the same parser ink-llm reads them with).
serde_json = "1"
# The Silero tests' synthetic non-speech fixtures, lifted as the gain stage lifts them.
ink-audio = { path = "../ink-audio" }
# Reads the local benchmark WAVs in the #[ignore] tests (Apache-2.0; already in the tree via
# ink-audio).
hound = "3.5.1"
