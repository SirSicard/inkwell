[package]
name = "ink-pipeline"
description = "Dictation chain, meeting chain, file import and watchdog."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ink-core.workspace = true
# The capture path after the ring (downmix, resampler), dictation takes, the VAD-gated gain stage.
ink-audio = { path = "../ink-audio" }
# Model updates go through the engine framework's residency and downloader.
ink-engines = { path = "../ink-engines" }
# AI polish (stage 9) is ink-llm's task, not a second copy of it here.
ink-llm = { path = "../ink-llm" }
# Echo cancellation for the mic: the path search, AEC3, the echo gate and duplicate-line removal.
ink-echo = { path = "../ink-echo" }
# File import reads WAV (Apache-2.0; already in the tree through ink-audio).
hound = "3.5.1"
# Snippet and voice-command triggers (MIT OR Unlicense). Already in the tree through regex.
aho-corasick = "1.1.5"
# Diagnostics: counts, levels and timings only, never text (I5, `tests/privacy_lint.rs`).
log = "0.4"
# Export and the dictionary's stored form, built and read as `serde_json::Value`, with no derive
# macros, as ink-llm does.
serde_json = "1"

[features]
# The real engines, for the ignored tests that run them (tests/real_engines.rs and the dictation
# bench test). Off in every default and CI build: engine-nemo links NeMo's library (it needs
# NEMO_SPEECH_DIR) and engine-llama builds llama.cpp. They are features passed through to
# ink-engines rather than dev-dependency features, because a dev-dependency's features are on in
# every test build.
engine-silero = ["ink-engines/engine-silero"]
engine-nemo = ["ink-engines/engine-nemo"]
engine-llama = ["ink-engines/engine-llama"]

[dev-dependencies]
ink-core = { workspace = true, features = ["mock"] }
# The meeting tests run the supersede against the real SQLite store too.
ink-store = { path = "../ink-store" }
# The AMI fixture is checked against its manifest (MIT OR Apache-2.0; already in the tree).
sha2 = "0.10.9"
# The echo fixture's room is convolved by FFT (MIT OR Apache-2.0; both already in the tree through
# ink-echo's aec3).
rustfft = "6.4.1"
num-complex = "0.4.6"
# A second connection holding a read transaction, as another process would, for the store's
# scrub (MIT; already in the tree through ink-store, with the same features).
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
