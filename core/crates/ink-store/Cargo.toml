[package]
name = "ink-store"
description = "SQLite store: WAL, STRICT, FTS5, migrations, supersede and importers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ink-core.workspace = true
# `bundled` compiles SQLite in (libsqlite3-sys, MIT; SQLite itself is public domain), so FTS5 is
# present on every OS and no system SQLite version is assumed. Default features are off: `cache`
# would add hashlink for a statement cache this store does not need, and the other default only
# matters on wasm.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# Ids are UUID v4 text. The random bytes come from getrandom directly because uuid's own `v4`
# constructor panics when the OS random source fails; here that is an error the caller sees.
getrandom = { version = "0.4.3", default-features = false }
uuid = { version = "1.24.0", default-features = false }
# The Inkwell 0.2 importer reads its JSON files. Parsed as `serde_json::Value` and validated field
# by field, as ink-llm does, with no derive macros.
serde_json = "1"
# A settings.json from an early 0.2 build can hold API keys in plaintext. The importer skips them,
# and wipes its own copies of them (the file's bytes, the parsed strings) instead of freeing them.
zeroize = "1"

[dev-dependencies]
ink-core = { workspace = true, features = ["mock"] }
# The importer's tests and its checklist binary hash the 0.2 sources before and after (sha256).
sha2 = "0.10.9"
# Test and example only: proves a 0.2 keychain item is the one ink-llm looks up, and the checklist
# binary asks the real keychain through ink-llm's attributes-only existence check. The library
# itself never depends on ink-llm.
ink-llm = { path = "../ink-llm" }
keyring-core = "1.0.0"
