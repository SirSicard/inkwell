# Inkwell 1.0 core. Every crate in docs/ARCHITECTURE.md exists from the first commit, so steps
# that run in parallel only ever edit their own crate.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/SirSicard/inkwell"
publish = false

[workspace.dependencies]
ink-core = { path = "crates/ink-core" }

# AEC3 runs per 10 ms frame in the echo tests (a minute of audio several times over); unoptimised,
# it dominated the debug test run. Only this crate is optimised: the workspace's own code keeps its
# debug build.
[profile.dev.package.aec3]
opt-level = 2
