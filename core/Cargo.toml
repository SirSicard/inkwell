# Inkwell 1.0 core. Every crate in docs/ARCHITECTURE.md exists from the first commit, so steps
# that run in parallel only ever edit their own crate.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/SirSicard/inkwell"
publish = false

[workspace.dependencies]
ink-core = { path = "crates/ink-core" }
