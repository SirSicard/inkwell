# cargo-deny for the core. Run from core/: `cargo deny --all-features check`.
# The licence rule is the one in CLAUDE.md: code dependencies are MIT, Apache-2.0, BSD-2/3, ISC or
# Zlib, and nothing else gets in without an entry here that says why.

[graph]
# Engine adapters sit behind cargo features; they are audited whether or not CI builds them.
all-features = true

[advisories]
# A RustSec advisory fails the build unless it is listed here with its reason.
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib"]
confidence-threshold = 0.93
# The first proc-macro dependency brings unicode-ident, whose Unicode tables are Unicode-3.0 (a
# permissive data licence). Add it then as a crate-scoped exception, not to `allow`:
#   exceptions = [{ allow = ["Unicode-3.0"], crate = "unicode-ident" }]
exceptions = []

[licenses.private]
# The workspace's own crates are MIT and unpublished.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace's unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
