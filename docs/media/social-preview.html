<!doctype html>
<!--
  Source for docs/media/social-preview.png, the image GitHub shows when the repo
  is linked in Slack, Discord, or a tweet. GitHub has no API for it: it is set by
  hand at Settings > General > Social preview, so the png is committed here and
  the upload is a manual step whenever this file changes.

  1280x640 is GitHub's recommended size. Regenerate with:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1280,640 --virtual-time-budget=8000 \
      --screenshot=docs/media/social-preview.png \
      "file://$PWD/docs/media/social-preview.html"

  --force-device-scale-factor=1 matters: without it a HiDPI machine renders at 2x
  and the png comes out 2560x1280, which GitHub accepts and then downscales badly.
  Fonts come from Google Fonts at render time, so an offline render silently falls
  back to system faces and the wordmark's metrics shift.

  Colours are the tokens from homepage/app/globals.css. The blob is a closed
  Catmull-Rom through twelve perturbed polar radii, baked to a path so it stays
  identical across rebuilds rather than being re-randomised into a new shape.
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500&display=block">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:640px; overflow:hidden; }
  body {
    background:#0e0e11; color:#f0ede8;
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; position:relative;
  }
  .glow { position:absolute; right:-90px; top:50%; transform:translateY(-50%);
          width:900px; height:900px; border-radius:50%;
          background:radial-gradient(circle, rgba(200,149,108,0.22) 0%, rgba(200,149,108,0.05) 45%, rgba(200,149,108,0) 68%); }
  .blob { position:absolute; right:104px; top:50%; transform:translateY(-50%); }
  .left { padding-left:96px; max-width:700px; position:relative; z-index:2; }
  h1 { font-size:108px; font-weight:700; letter-spacing:-0.038em; line-height:0.96; }
  .tag { color:#c8956c; font-size:33px; font-weight:500; margin-top:24px; letter-spacing:-0.014em; }
  .sub { color:rgba(240,237,232,0.72); font-size:25px; margin-top:14px; letter-spacing:-0.008em; }
  .rule { width:72px; height:3px; background:#c8956c; margin:44px 0 24px; border-radius:2px; }
  .meta { font-family:'JetBrains Mono',ui-monospace,'SF Mono',monospace; font-size:15.5px;
          letter-spacing:0.155em; color:rgba(240,237,232,0.60); text-transform:uppercase; }
  .plat { font-family:'JetBrains Mono',ui-monospace,'SF Mono',monospace; font-size:15.5px;
          letter-spacing:0.155em; color:rgba(240,237,232,0.46); text-transform:uppercase; margin-top:15px; }
</style></head><body>
  <div class="glow"></div>
