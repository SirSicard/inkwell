<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="warm" cx="50%" cy="38%" r="70%">
      <stop offset="0%"   stop-color="#c8956c" stop-opacity="0.42"/>
      <stop offset="45%"  stop-color="#c8956c" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c8956c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0.3" y1="0" x2="0.66" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="52%"  stop-color="#f2efea"/>
      <stop offset="100%" stop-color="#dcd6cd"/>
    </linearGradient>
    <!-- The ripple fades at its ends, the way a real one does, instead of
         closing into a hard ring. -->
    <linearGradient id="rip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f0ede8" stop-opacity="0.05"/>
      <stop offset="30%"  stop-color="#f0ede8" stop-opacity="0.75"/>
      <stop offset="70%"  stop-color="#f0ede8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f0ede8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#0e0e11"/>
  <circle cx="512" cy="400" r="520" fill="url(#warm)"/>

  <path d="M 512 138
           C 610 288 700 402 700 494
           a 188 188 0 1 1 -376 0
           C 324 402 414 288 512 138 Z"
        fill="url(#ink)"/>

  <!-- Closer to the drop than the draft, and thinner. Two rings at this size
       read as rings; two arcs that fade at the ends read as water. -->
  <ellipse cx="512" cy="812" rx="252" ry="44" fill="none"
           stroke="url(#rip)" stroke-opacity="0.34" stroke-width="15"/>
  <ellipse cx="512" cy="812" rx="140" ry="25" fill="none"
           stroke="url(#rip)" stroke-opacity="0.85" stroke-width="16"/>
</svg>
