[package]
name = "app"
version = "0.2.8"
description = "Inkwell, local-first dictation"
authors = ["Mattias Herzig"]
license = "MIT"
repository = "https://github.com/SirSicard/inkwell"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-log = "2"
cpal = "0.18"
tauri-plugin-global-shortcut = "2.3.1"
hound = "3.5.1"
rubato = "0.16"
sherpa-onnx = { version = "1.13", default-features = false, features = ["static"] }
arboard = "3"
enigo = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
csv = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
# rustls rather than the default native-tls, which pulls in openssl and with it
# the largest block of advisories against this project. Also removes a C
# dependency from every build. rustls-tls bundles the Mozilla root store, which
# is more predictable across the three platforms than each OS trust store.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# keyring 3 ships NO credential store by default: every backend is behind a
# feature flag. Declared as a bare `keyring = "3"` it compiles and runs, and
# then fails at the first set_password because there is no store behind it,
# which is why saving an API key silently did nothing. Backends are selected
# per platform below.
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
aho-corasick = "1"
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "aac", "isomp4", "mkv", "pcm", "vorbis", "alac"] }
tauri-plugin-single-instance = "2.4.3"

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26"
keyring = { version = "3", features = ["apple-native"] }
# Every read path keyring exposes returns the secret, and macOS authorizes each
# one with a dialog. Used directly to ask whether an item *exists*, which is an
# attributes-only query the OS does not gate. Already in the tree as a transitive
# dependency of keyring, so this pins no new code, only names it.
security-framework = "3"

[target."cfg(target_os = \"windows\")".dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target."cfg(target_os = \"linux\")".dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
