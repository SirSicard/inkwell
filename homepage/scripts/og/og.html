<!doctype html>
<!-- The social card, 1200 × 630, in the homepage's own system: paper ground, Archivo at its wide
     widths, and the real app window cropped to its ink panel, running off the card's edges.
     Rendered to public/og.png by scripts/make-og.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Archivo Variable";
    src: url("../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2") format("woff2-variations");
    font-weight: 100 900; font-stretch: 62% 125%;
  }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f0ede8; color: #0f0f0f; font-family: "Archivo Variable", sans-serif; position: relative; }
  .copy { position: absolute; left: 72px; top: 64px; width: 560px; }
  .wordmark { font-size: 30px; font-weight: 820; font-stretch: 125%; letter-spacing: -0.01em; line-height: 1; }
  h1 { margin: 58px 0 0; font-size: 80px; font-weight: 800; font-stretch: 116%; line-height: 0.98; letter-spacing: -0.022em; }
  p { margin: 30px 0 0; font-size: 25px; line-height: 1.4; color: #4d4c4a; max-width: 30ch; }
  .window {
    position: absolute; left: 700px; top: 72px; width: 560px; height: 620px; overflow: hidden;
    border-radius: 14px 0 0 0;
    box-shadow: 0 1px 1px rgb(15 15 15 / 0.06), 0 12px 24px -10px rgb(15 15 15 / 0.28), 0 34px 60px -24px rgb(15 15 15 / 0.32);
  }
  .window img { display: block; width: 1040px; height: auto; } /* 0.65 of the 1600 px capture */
</style>
</head>
<body>
  <div class="copy">
    <div class="wordmark">Inkwell</div>
    <h1>Dictation that&nbsp;stays on&nbsp;your&nbsp;desk.</h1>
    <p>Free and MIT licensed. It runs on your CPU, on macOS, Windows and Linux.</p>
  </div>
  <div class="window"><img src="../../src/assets/inkwell-dashboard.png" alt=""></div>
</body>
</html>
